<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#075e54">
  <title>Chat Viewer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="avatar" id="avatar" aria-hidden="true">WA</div>
      <div class="conversation">
        <h1 id="conversation-title">Chat Viewer</h1>
        <p id="conversation-subtitle">Buka file export WhatsApp untuk mulai membaca</p>
      </div>
      <button class="load-button" id="load-button" type="button" aria-label="Pilih file chat">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 16V4m0 0L7 9m5-5 5 5M5 14v5h14v-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Pilih chat</span>
      </button>
      <input class="file-input" id="file-input" type="file" accept=".txt,text/plain">
    </header>

    <section class="toolbar" aria-label="Kontrol chat">
      <label class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="10.8" cy="10.8" r="6.8" stroke="currentColor" stroke-width="2"/>
          <path d="m16 16 4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input class="search" id="search" type="search" placeholder="Cari pesan..." aria-label="Cari pesan" disabled>
      </label>
      <button class="jump-button" id="jump-button" type="button" disabled>Lompat</button>
      <label class="side-control" for="right-side">
        <span>Kanan:</span>
        <select id="right-side" disabled aria-label="Pilih peserta yang pesannya di kanan">
          <option value="">Pilih peserta</option>
        </select>
      </label>
    </section>

    <div class="status" id="status" role="status" aria-live="polite"></div>
    <section class="chat" id="chat" aria-label="Isi percakapan" aria-live="polite">
      <div class="empty-state" id="empty-state">
        <div class="empty-icon" aria-hidden="true">☏</div>
        <h2>Baca chat tanpa ribet</h2>
        <p>Pilih file export WhatsApp berformat <strong>.txt</strong>. Pesan akan ditata seperti percakapan WhatsApp dan file tetap diproses di browser ini.</p>
        <button class="load-button" id="empty-load-button" type="button">Pilih file chat.txt</button>
      </div>
    </section>
    <div class="footer-hint">Chat diproses secara lokal di browser kamu.</div>
  </main>

  <script>
    (() => {
      "use strict";

      const messageStart = /^\[?(\d{1,2}[/-]\d{1,2}[/-]\d{2,4}),?\s+(\d{1,2}[.:]\d{2}(?::\d{2})?)\]?\s+-\s+(.*)$/;
      const chat = document.getElementById("chat");
      const fileInput = document.getElementById("file-input");
      const searchInput = document.getElementById("search");
      const jumpButton = document.getElementById("jump-button");
      const rightSide = document.getElementById("right-side");
      const status = document.getElementById("status");
      const emptyState = document.getElementById("empty-state");
      const title = document.getElementById("conversation-title");
      const subtitle = document.getElementById("conversation-subtitle");
      const avatar = document.getElementById("avatar");
      let messages = [];
      let visibleMessages = [];
      let rightParticipant = "";
      let sourceName = "";
      let renderVersion = 0;
      let searchMatches = [];
      let searchMatchPosition = -1;
      let showingAllMessages = false;
      let highlightedMessage = null;
      let highlightTimeout = 0;

      function showStatus(text) {
        status.textContent = text;
        status.classList.add("visible");
      }

      function clearStatus() {
        status.textContent = "";
        status.classList.remove("visible");
      }

      function parseChat(text) {
        const parsed = [];
        const senders = new Set();
        let current = null;

        for (const line of text.replace(/^\uFEFF/, "").split(/\r?\n/)) {
          const match = line.match(messageStart);
          if (match) {
            if (current) parsed.push(current);
            const timestamp = `${match[1]} ${match[2]}`;
            const body = match[3];
            const separator = body.match(/^([^:]+):\s?([\s\S]*)$/);
            current = {
              date: match[1],
              time: match[2].replace(".", ":"),
              timestamp,
              sender: separator ? separator[1].trim() : "",
              text: separator ? separator[2] : body,
              system: !separator,
              missingMedia: /<media tidak disertakan>/i.test(separator ? separator[2] : body),
              oneView: Boolean(separator && separator[2].trim() === "")
            };
            if (current.sender) senders.add(current.sender);
          } else if (current) {
            current.text += `\n${line}`;
          } else if (line.trim()) {
            parsed.push({ date: "", time: "", sender: "", text: line, system: true });
          }
        }

        if (current) parsed.push(current);
        return {
          messages: parsed.map((message, index) => ({ ...message, index })),
          senders: [...senders]
        };
      }

      function escapeHtml(text) {
        return text.replace(/[&<>"']/g, character => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        })[character]);
      }

      function formatText(text) {
        let safe = escapeHtml(text);
        safe = safe.replace(/```([\s\S]+?)```/g, "<code>$1</code>");
        safe = safe.replace(/`([^`\n]+)`/g, "<code>$1</code>");
        safe = safe.replace(/\*([^*\n]+)\*/g, "<strong>$1</strong>");
        safe = safe.replace(/_([^_\n]+)_/g, "<em>$1</em>");
        safe = safe.replace(/~([^~\n]+)~/g, "<del>$1</del>");
        return safe.replace(/https?:\/\/[^\s<]+/g, url => {
          const cleanUrl = url.replace(/[),.!?]+$/, "");
          const trailing = url.slice(cleanUrl.length);
          return `<a href="${cleanUrl}" target="_blank" rel="noopener noreferrer">${cleanUrl}</a>${trailing}`;
        });
      }

      function dateLabel(rawDate) {
        const parts = rawDate.split(/[/-]/).map(Number);
        if (parts.length !== 3 || parts.some(Number.isNaN)) return rawDate;
        const year = parts[2] < 100 ? 2000 + parts[2] : parts[2];
        const date = new Date(year, parts[1] - 1, parts[0]);
        if (Number.isNaN(date.getTime())) return rawDate;
        return new Intl.DateTimeFormat("id-ID", {
          day: "numeric",
          month: "long",
          year: "numeric"
        }).format(date);
      }

      function setParticipants(senders) {
        rightSide.replaceChildren();
        const placeholder = document.createElement("option");
        placeholder.value = "";
        placeholder.textContent = senders.length ? "Pilih peserta" : "Tidak ada";
        rightSide.append(placeholder);

        for (const sender of senders) {
          const option = document.createElement("option");
          option.value = sender;
          option.textContent = sender;
          rightSide.append(option);
        }

        rightParticipant = senders[0] || "";
        rightSide.value = rightParticipant;
        rightSide.disabled = senders.length === 0;
        searchInput.disabled = messages.length === 0;

        if (senders.length === 1) {
          rightParticipant = senders[0];
          rightSide.value = rightParticipant;
        }
      }

      function messageHtml(message, previous) {
        if (message.system) {
          const time = message.time
            ? `<span class="system-time">${escapeHtml(message.time)}</span>`
            : "";
          return `<div class="system-row" data-message-index="${message.index}"><div class="system-bubble">${formatText(message.text)}${time}</div></div>`;
        }

        const outgoing = message.sender === rightParticipant;
        const side = outgoing ? "outgoing" : "incoming";
        const specialPlaceholder = message.missingMedia || message.oneView;
        const placeholderClass = specialPlaceholder ? " special-placeholder" : "";
        const sameGroup = previous && !previous.system &&
          previous.sender === message.sender && previous.date === message.date;
        const groupingClass = sameGroup ? "grouped" : "separate";
        const senderLabel = !outgoing && !sameGroup
          ? `<span class="sender">${escapeHtml(message.sender)}</span>`
          : "";
        const text = message.missingMedia
          ? "kemungkinan sticker/img/video/vn/call/vc"
          : message.oneView
            ? "1x Lihat Foto / Video"
            : formatText(message.text);
        return `<div class="message-row ${side}${placeholderClass} ${groupingClass}" data-message-index="${message.index}"><div class="bubble">${senderLabel}<span class="message-text">${text}</span><span class="time">${escapeHtml(message.time)}</span></div></div>`;
      }

      function dateSeparator(date) {
        return `<div class="date-row"><span class="date-label">${escapeHtml(dateLabel(date))}</span></div>`;
      }

      function renderRange(start, end) {
        const fragment = document.createDocumentFragment();
        let previous = null;

        for (let index = start; index < end; index += 1) {
          const message = visibleMessages[index];
          if (message.date && (!previous || previous.date !== message.date)) {
            const separator = document.createElement("div");
            separator.innerHTML = dateSeparator(message.date);
            fragment.append(separator.firstElementChild);
          }
          const row = document.createElement("div");
          row.innerHTML = messageHtml(message, previous);
          fragment.append(row.firstElementChild);
          previous = message;
        }

        chat.append(fragment);
      }

      function updateConversationInfo() {
        const senders = [...new Set(messages.filter(message => message.sender).map(message => message.sender))];
        title.textContent = senders.length ? senders.join(" dan ") : sourceName || "Chat Viewer";
        avatar.textContent = senders.length ? senders[0].trim().slice(0, 2).toUpperCase() : "WA";
        subtitle.textContent = `${messages.length.toLocaleString("id-ID")} pesan${sourceName ? ` · ${sourceName}` : ""}`;
      }

      function updateJumpButton() {
        const hasMatches = searchMatches.length > 0;
        jumpButton.disabled = !hasMatches;
        if (hasMatches && searchMatchPosition >= 0) {
          jumpButton.textContent = `Lompat (${searchMatchPosition + 1}/${searchMatches.length})`;
        } else {
          jumpButton.textContent = "Lompat";
        }
      }

      function scrollToMessage(index) {
        const target = chat.querySelector(`[data-message-index="${index}"]`);
        if (!target) return;

        if (highlightedMessage) highlightedMessage.classList.remove("jump-highlight");
        window.clearTimeout(highlightTimeout);
        highlightedMessage = target;
        target.classList.add("jump-highlight");
        target.scrollIntoView({ behavior: "smooth", block: "center" });
        highlightTimeout = window.setTimeout(() => {
          target.classList.remove("jump-highlight");
          if (highlightedMessage === target) highlightedMessage = null;
        }, 1800);
      }

      function renderChat(scrollToBottom, showAll = false, focusIndex = null) {
        const version = ++renderVersion;
        const query = searchInput.value.trim().toLocaleLowerCase("id-ID");
        showingAllMessages = Boolean(query && showAll);
        searchMatches = query
          ? messages
            .filter(message => message.text.toLocaleLowerCase("id-ID").includes(query) ||
              message.sender.toLocaleLowerCase("id-ID").includes(query))
            .map(message => message.index)
          : [];
        if (!query) {
          searchMatchPosition = -1;
          showingAllMessages = false;
        }
        visibleMessages = query && !showingAllMessages
          ? searchMatches.map(index => messages[index])
          : messages;

        chat.replaceChildren();
        emptyState.hidden = true;
        renderRange(0, visibleMessages.length);

        if (query) {
          const resultInfo = `${searchMatches.length.toLocaleString("id-ID")} hasil pencarian`;
          subtitle.textContent = showingAllMessages
            ? `${resultInfo} · menampilkan seluruh chat`
            : `${resultInfo} dari ${messages.length.toLocaleString("id-ID")} pesan`;
        } else {
          updateConversationInfo();
        }
        updateJumpButton();

        if (scrollToBottom && version === renderVersion) chat.scrollTop = chat.scrollHeight;
        if (focusIndex !== null) scrollToMessage(focusIndex);
        if (visibleMessages.length === 0) {
          const noResults = document.createElement("div");
          noResults.className = "empty-state";
          noResults.innerHTML = `<h2>Tidak ada pesan yang cocok</h2><p>Coba kata kunci lain.</p>`;
          chat.append(noResults);
        }
      }

      async function loadFile(file) {
        if (!file) return;
        if (!file.name.toLowerCase().endsWith(".txt") && file.type !== "text/plain") {
          showStatus("File tidak dikenali. Pilih file export WhatsApp berformat .txt.");
          return;
        }

        try {
          const text = await file.text();
          const result = parseChat(text);
          if (result.messages.length === 0) {
            showStatus("File berhasil dibaca, tetapi tidak ada pesan yang dikenali. Pastikan formatnya export chat WhatsApp (.txt).");
            return;
          }
          messages = result.messages;
          sourceName = file.name;
          clearStatus();
          setParticipants(result.senders);
          updateConversationInfo();
          renderChat(true);
        } catch (error) {
          showStatus(`File tidak bisa dibaca: ${error.message || "terjadi kesalahan saat membuka file."}`);
        }
      }

      document.getElementById("load-button").addEventListener("click", () => fileInput.click());
      document.getElementById("empty-load-button").addEventListener("click", () => fileInput.click());
      fileInput.addEventListener("change", event => {
        const file = event.target.files && event.target.files[0];
        loadFile(file);
        fileInput.value = "";
      });
      searchInput.addEventListener("input", () => {
        searchMatchPosition = -1;
        renderChat(true);
      });
      jumpButton.addEventListener("click", () => {
        if (searchMatches.length === 0) return;
        searchMatchPosition = (searchMatchPosition + 1) % searchMatches.length;
        const targetIndex = searchMatches[searchMatchPosition];
        if (showingAllMessages) {
          updateJumpButton();
          scrollToMessage(targetIndex);
        } else {
          renderChat(false, true, targetIndex);
        }
      });
      rightSide.addEventListener("change", () => {
        rightParticipant = rightSide.value;
        renderChat(true, showingAllMessages);
      });

      chat.addEventListener("dragover", event => {
        event.preventDefault();
        event.dataTransfer.dropEffect = "copy";
      });
      chat.addEventListener("drop", event => {
        event.preventDefault();
        loadFile(event.dataTransfer.files && event.dataTransfer.files[0]);
      });

      fetch("chat.txt")
        .then(response => {
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return response.text();
        })
        .then(text => {
          const result = parseChat(text);
          if (result.messages.length === 0) {
            showStatus("chat.txt ditemukan, tetapi format pesannya tidak dikenali. Kamu bisa memilih file export secara manual.");
            return;
          }
          messages = result.messages;
          sourceName = "chat.txt";
          clearStatus();
          setParticipants(result.senders);
          updateConversationInfo();
          renderChat(true);
        })
        .catch(() => {
          showStatus("Pilih file chat.txt lewat tombol di atas. Browser tidak mengizinkan halaman ini membaca file di sebelahnya secara otomatis.");
        });
    })();
  </script>
</body>
</html>
